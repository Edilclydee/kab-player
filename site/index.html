<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K&amp;B Archive</title>
<meta name="theme-color" content="#0e0e10">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K&amp;B Archive">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Kevin &amp; Bean Archive, home"><img class="logo" src="/logo.png" alt="" width="202" height="171"><span class="brand-sub">Archive</span></a>
  <nav class="tabs">
    <a href="#/" data-tab="shows">Shows</a>
    <a href="#/clips" data-tab="clips">Clips</a>
  </nav>
  <label class="top-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="top-q" type="search" placeholder="Search shows &amp; clips" autocomplete="off" enterkeyhint="search" aria-label="Search shows and clips">
  </label>
  <nav class="top-actions">
    <a class="icon" href="#/favorites" title="Favorites" aria-label="Favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.3s-7.4-4.5-9.1-9.1C1.8 8 3.9 4.6 7.3 4.6c2 0 3.7 1.1 4.7 2.7 1-1.6 2.7-2.7 4.7-2.7 3.4 0 5.5 3.4 4.4 6.6-1.7 4.6-9.1 9.1-9.1 9.1z"/></svg></a>
    <a class="icon" href="#/settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></a>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer id="player" hidden>
  <div class="pb-progress"><i></i></div>
  <button class="pb-info" data-act="open-sheet" aria-label="Open player">
    <span class="pb-art"></span>
    <span class="pb-text"><span class="pb-title"></span><span class="pb-sub"></span></span>
  </button>
  <div class="pb-controls">
    <button class="icon" data-act="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L7 6l5 4.5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.6" font-weight="700">15</text></svg></button>
    <button class="icon play" data-act="toggle" aria-label="Play"></button>
    <button class="icon" data-act="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L17 6l-5 4.5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.6" font-weight="700">30</text></svg></button>
    <span class="pb-volume">
      <button class="icon vol-btn" data-act="mute" aria-label="Mute"></button>
      <input type="range" class="vol" min="0" max="100" step="1" value="100" aria-label="Volume">
    </span>
  </div>
</footer>

<div id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-label="Now playing">
    <div class="sheet-head">
      <button class="icon" data-act="close-sheet" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="sheet-era"></span>
      <span class="sheet-actions">
        <button class="icon fav-btn" data-act="fav-current" aria-label="Add to favorites"></button>
        <button class="icon" data-act="sheet-more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </span>
    </div>
    <div class="np-art"></div>
    <h2 class="np-title"></h2>
    <p class="np-sub"></p>
    <input type="range" class="np-seek" min="0" max="1000" step="1" value="0" aria-label="Seek">
    <div class="np-times"><span class="t-cur">0:00</span><span class="t-left">-0:00</span></div>
    <div class="np-controls">
      <button class="icon" data-act="prev" aria-label="Previous show"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="icon" data-act="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L7 6l5 4.5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.6" font-weight="700">15</text></svg></button>
      <button class="icon play big" data-act="toggle" aria-label="Play"></button>
      <button class="icon" data-act="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L17 6l-5 4.5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.3" text-anchor="middle" font-size="6.6" font-weight="700">30</text></svg></button>
      <button class="icon" data-act="next" aria-label="Next show"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="np-volume">
      <button class="icon vol-btn" data-act="mute" aria-label="Mute"></button>
      <input type="range" class="vol" min="0" max="100" step="1" value="100" aria-label="Volume">
    </div>
    <div class="np-extras">
      <button class="chip" data-act="speed">1×</button>
      <button class="chip" data-act="sleep">Sleep timer</button>
      <button class="chip" data-act="goto-year">All shows</button>
      <button class="chip" data-act="related" hidden>Clips from this day</button>
    </div>
  </div>
</div>

<div id="menu" hidden><div class="menu-panel" role="menu"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js" defer></script>
</body>
</html>
